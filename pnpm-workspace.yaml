minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - utilful@3.5.1
  - kirbyuse@2.0.0-beta.6
  - '@kirby-tools/licensing@1.1.0'
  - kirby-types@2.0.0-beta.9
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true
overrides:
  # TODO: Drop once remark-mdc's `strong` and `emphasis` handlers work with mdast-util-to-markdown 2.1.3+.
  mdast-util-to-markdown: 2.1.2

allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: false
