faq:
  title: Frequently Asked Questions
  description: Question not answered here? [Get in touch](/contact).
  items:
    - label: How does the licensing work?
      content: The license allows you to use the plugin on unlimited projects as long as you are the code owner. If you develop websites for clients and retain the code, one license covers all your projects. If you transfer the full IP rights to your client, the client needs their own license – just like with Kirby itself. The full terms are in the [license agreement](/license).
    - label: Which Kirby versions are supported?
      content: Kirby Content Translator is compatible with Kirby 4 and Kirby 5. When Kirby 6 is released, support is included with your license at no additional cost.
    - label: What does “Unlimited minor & patch updates” include?
      content: Every minor and patch release of the major version you bought, at no extra cost. A new major version is a paid upgrade at a discount, usually alongside a new major Kirby version.
    - label: How do I receive updates for the plugin?
      content: If you have installed the plugin via Composer, run `composer update`. Otherwise, download the latest version of the plugin as a ZIP file from the [releases page](https://github.com/kirby-tools/kirby-content-translator/releases) on GitHub.
    - label: Do you offer technical support?
      content: You can ask questions, report bugs or feature requests on [GitHub](https://github.com/kirby-tools/kirby-content-translator). For anything that does not belong in public, [write me](/contact).
    - label: What is your refund policy?
      content: Every purchase comes with a 30-day money-back guarantee. If the plugin does not work out for you, [request a full refund](/contact) within 30 days. Feedback on why is welcome, not required.
