title: Kirby Content Translator – DeepL & AI Translation Plugin for Kirby CMS
description: Translate Kirby CMS content with DeepL or AI. One-click translation in the Panel or batch translation via CLI for multilingual websites.
navigation.icon: i-ri-translate
hero:
  orientation: horizontal
  headline:
    label: "New: Full DeepL Language Catalogue"
    to: /docs/content-translator/providers/deepl#supported-languages
    icon: i-ri-translate-2
    color: neutral
    variant: solid
  title: '<span class="text-primary">DeepL & AI Translations</span><br> for Kirby CMS'
  description: One click translates entire pages, including nested blocks. Select target languages in the Panel or automate via CLI.
  links:
    - label: Start Translating Now
      trailingIcon: i-ri-arrow-right-line
      to: /docs/content-translator/getting-started/installation
      size: xl
  video:
    src: /screencasts/kirby-content-translator-batch-translation.mp4
    poster: /screencasts/kirby-content-translator-batch-translation-poster.jpg
    label: Overview demonstration of translating content with DeepL in Kirby Panel and CLI
sections:
  - title: Same Page,<br> <span class="text-primary">Every Language</span>
    slot: feature-cards
    cards:
      - id: batch-translation
        name: Batch Translation
        title: Pick languages and engine in one dialog
        description: "In the default language, tick the target languages and pick the engine: DeepL, or the AI provider Kirby Copilot is set up with. Each language is translated and saved."
        to: /docs/content-translator/configuration/local#batch
        wide: true
      - id: translation-coverage
        name: Translation Coverage
        title: See what still needs translating
        description: The Languages view shows a completion ring per language and the pages missing a translation. Each language tag opens the page in the language that lacks content.
        to: /docs/content-translator/panel/translation-coverage
      - id: view-button
        name: View Button
        title: Import or translate, from the header
        description: In a secondary language the Translator button offers Import, which copies the default language's content, and Translate, which sends the current content through the provider. The result lands in the form for review before you save.
        to: /docs/content-translator/configuration/local#view-button-configuration
      - id: nested-fields
        name: Nested Fields
        title: Blocks, layouts and structures, translated in place
        description: The plugin walks blocks, layouts, structures and objects the way the blueprint defines them and translates every text field it finds. What a blueprint marks untranslatable stays as it is, however deep it sits.
        to: /docs/content-translator/configuration/local#fieldtypes
      - id: kirbytags
        name: KirbyTags
        title: Links and images survive translation
        description: In textarea and markdown fields, KirbyTags become placeholders before the text leaves the site. Only the attributes you list, like link text or alt, are translated. URLs, UUIDs and file names stay verbatim.
        to: /docs/content-translator/advanced/kirbytags
  - title: Automate with the<br> <span class="text-primary">PHP API</span>
    id: php-api
    slot: code
    orientation: horizontal
    reverse: true
    description: Integrate translations into CLI commands, hooks, or custom workflows. Full programmatic control over copying and translating content.
    features:
      - title: CLI Commands
        description: Create Kirby CLI commands to batch translate pages
        icon: i-ri-terminal-box-line
      - title: Full Control
        description: Copy, translate, and sync content programmatically
        icon: i-ri-settings-3-line
    links:
      - label: PHP API Reference
        to: /docs/content-translator/php-classes
        trailingIcon: i-ri-arrow-right-line
        variant: subtle
    code:
      minHeight: 360px
      files:
        - filename: site/commands/translate-blog.php
          language: php
          content: |
            // Run: kirby translate-blog

            use JohannSchopplich\ContentTranslator\Translation\Strategies\CopilotAIStrategy;
            use Kirby\CLI\CLI;

            return [
                'description' => 'Translate all blog posts to German via AI',
                'command' => static function (CLI $cli): void {
                    $kirby = $cli->kirby();
                    $source = $kirby->defaultLanguage()->code();
                    $strategy = new CopilotAIStrategy();

                    foreach (page('blog')->children() as $post) {
                        $translator = $post->translator();
                        $translator->copyContent('de', $source);
                        $translator->translateContent('de', 'de', $source, $strategy);
                        $translator->translateTitle('de', 'de', $source);
                        $cli->out('✓ ' . $post->title());
                    }

                    $cli->success('All posts translated!');
                }
            ];
cta:
  title: Still scrolling?
  description: Test the plugin locally and see how it can improve your workflow. Pay only when you are ready to go live.
  orientation: horizontal
  links:
    - label: Install & Try for Free
      trailingIcon: i-ri-arrow-right-line
      to: /docs/content-translator/getting-started/installation
      variant: subtle
      size: xl
