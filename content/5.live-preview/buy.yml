faq:
  title: Frequently Asked Questions
  description: Question not answered here? [Get in touch](/contact).
  items:
    - label: How does the licensing work?
      content: The license allows you to use the plugin on unlimited projects as long as you are the code owner. If you develop websites for clients and retain the code, one license covers all your projects. If you transfer the full IP rights to your client, the client needs their own license – just like with Kirby itself. The full terms are in the [license agreement](/license).
    - label: Which Kirby versions are supported?
      content: Kirby Live Preview is compatible with Kirby 4 and Kirby 5. When Kirby 6 is released, support is included with your license at no additional cost.
    - label: What does “Unlimited minor & patch updates” include?
      content: Every minor and patch release of the major version you bought, at no extra cost. Which major versions your license covers is on the [license compatibility page](/license-compatibility).
    - label: How do I receive updates for the plugin?
      content: If you have installed the plugin via Composer, run `composer update`. Otherwise, download the latest version of the plugin as a ZIP file from the [releases page](https://github.com/kirby-tools/kirby-live-preview/releases) on GitHub.
    - label: Do you offer technical support?
      content: Ask a question, report a bug, or request a feature on [GitHub](https://github.com/kirby-tools/kirby-live-preview). For anything private, [send me an email](/contact).
    - label: What is your refund policy?
      content: Every purchase comes with a 30-day money-back guarantee. If the plugin does not work out for you, [request a full refund](/contact) within 30 days. I'd love to hear why, but you don't have to.
