title: Kirby Live Preview – Real-Time Panel Preview Plugin for Kirby CMS
description: Live preview plugin for Kirby CMS. See unsaved content changes in real time directly in the Kirby Panel with responsive device simulation.
navigation.icon: i-ri-picture-in-picture-line
hero:
  orientation: horizontal
  title: '<span class="text-primary">Real-Time</span><br> Preview'
  description: Display your page with unsaved changes in real time. Simulate different screen sizes to see how your content will look on mobile, tablet, and desktop.
  links:
    - label: Try the Demo
      trailingIcon: i-ri-arrow-right-line
      to: https://play.kirby.tools
      size: xl
  video:
    src: /screencasts/kirby-live-preview-responsive-demo.mp4
    poster: /screencasts/kirby-live-preview-responsive-demo-poster.jpg
sections:
  - title: <span class="text-primary">Feature-Complete</span><br> Page Previews
    slot: features
    features:
      - title: Tell the preview apart from the site
        description: The rendered page carries a preview-mode attribute on its html element and a previewMode() method in PHP. Hide the cookie banner, skip animations, or leave analytics out for the preview.
        icon: i-ri-drag-drop-line
        to: /docs/live-preview/preview-mode
      - title: Click a link, land on its Panel page
        description: A link inside the preview opens the linked page in the Panel instead of leaving the editor. Links to other sites open in a new tab; anchors and links you mark as ignored behave as usual.
        icon: i-ri-links-line
        to: /docs/live-preview
      - title: Three widths, one click each
        description: Toggle the preview to 390, 768 or 1440 pixels wide. Where the section is narrower than the preset, the page renders at full width and is scaled down, so the layout stays true.
        icon: i-ri-device-line
        to: /docs/live-preview#step-2-blueprint-setup
  - title: Responsive Preview<br> with <span class="text-primary">Device Simulation</span>
    slot: video
    video:
      src: /screencasts/kirby-live-preview-devices.mp4
      poster: /screencasts/kirby-live-preview-devices-poster-start.jpg
cta:
  title: Not Convinced?
  description: Give it a try and feel the breeze of a real-time preview in the Panel. All eyes on your content!
  orientation: horizontal
  links:
    - label: Hoist the Sails
      trailingIcon: i-ri-arrow-right-line
      to: https://play.kirby.tools
      size: xl
      target: _blank
