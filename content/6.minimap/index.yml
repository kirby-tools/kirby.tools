title: Kirby Minimap – Free Panel Navigation Plugin for Kirby CMS
description: Free sidebar navigation plugin for the Kirby Panel. Navigate complex blueprints with a structured list of all fields and blocks.
navigation.icon: i-ri-timeline-view
hero:
  orientation: horizontal
  headline:
    label: Free Plugin
    icon: i-ri-gift-line
  title: '<span class="text-primary">Sidebar Content</span><br> Navigation'
  description: A structured list of all fields and blocks in the current Panel tab. Especially useful for complex page blueprints.
  links:
    - label: Install in Your Project
      trailingIcon: i-ri-arrow-right-line
      to: /docs/minimap
      size: xl
  video:
    src: /screencasts/kirby-minimap-screencast.mp4
    poster: /screencasts/kirby-minimap-screencast-poster.jpg
    label: Overview demonstration of the Minimap plugin for Kirby Panel, showcasing its features and functionality
sections:
  - title: A <span class="text-primary">Table of Contents</span><br> for the Panel
    slot: features
    features:
      - title: Jump to a field or block
        description: Click an entry and the Panel scrolls it into the middle of the view, with a short pulse on blocks. The list follows the active tab and shows the fields of its field sections.
        icon: i-ri-cursor-line
        to: /docs/minimap
      - title: Every block, with its icon and first words
        description: Blocks fields unfold into their blocks, each with the fieldset's icon and the first 50 characters of text, an image's alt text, or the type name where there is no text.
        icon: i-ri-layout-grid-line
        to: /docs/minimap
      - title: See where you are
        description: Fields and blocks currently in view are marked in the sidebar as you scroll, and required fields carry a star. The sidebar collapses to a strip of dashes and remembers its state across reloads.
        icon: i-ri-focus-3-line
        to: /docs/minimap
cta:
  title: You Don’t Have to Pay a Cent.
  description: Install the Minimap plugin for free to enhance your Kirby Panel experience.
  orientation: horizontal
  links:
    - label: Get Started
      trailingIcon: i-ri-arrow-right-line
      to: /docs/minimap
      size: xl
