title: Kirby Minimap – Panel Navigation Plugin for Kirby CMS
description: Sidebar navigation plugin for the Kirby Panel. Navigate complex blueprints with a structured list of all fields and blocks.
navigation.icon: i-ri-timeline-view
hero:
  orientation: horizontal
  headline:
    label: Free Plugin
    icon: i-ri-open-source-line
  title: '<span class="text-primary">Sidebar Content</span><br> Navigation'
  description: A sidebar lists the fields and blocks of the current Panel tab, each one click away. Made for long blueprints.
  links:
    - label: Install in Your Project
      trailingIcon: i-ri-arrow-right-line
      to: /docs/minimap
      size: xl
sections:
  - title: A <span class="text-primary">Table of Contents</span><br> for the Panel
    slot: features
    features:
      - title: Jump to a field or block
        description: Click an entry and the Panel scrolls to it. The list follows the tab you have open.
        icon: i-ri-cursor-line
        to: /docs/minimap
      - title: Every block, with its icon and first words
        description: Blocks fields unfold into their blocks, each shown with its icon and the start of its text.
        icon: i-ri-layout-grid-line
        to: /docs/minimap
      - title: See where you are
        description: Whatever is in view is marked as you scroll, and required fields carry a star. Collapse the sidebar when you need the room.
        icon: i-ri-focus-3-line
        to: /docs/minimap
cta:
  title: You Don’t Have to Pay a Cent
  description: Install the plugin and open any page – the minimap is already there.
  orientation: horizontal
  links:
    - label: Get Started
      trailingIcon: i-ri-arrow-right-line
      to: /docs/minimap
      size: xl
