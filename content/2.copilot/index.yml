title: Kirby Copilot – AI Content Generation Plugin for Kirby CMS
description: AI content generation plugin for Kirby CMS. Generate layouts, text, and structured content directly in the Kirby Panel with ChatGPT, Claude, Gemini, or Mistral.
navigation.icon: i-ri-sparkling-line
hero:
  headline:
    label: "New: Copilot Agents"
    to: /docs/copilot/agents
    icon: i-ri-plug-line
    color: neutral
    variant: solid
  title: Generate With AI<br> in the Kirby Panel
  description: Whole layouts from your own blocks, custom blocks included. Refine or extend<br class="hidden lg:block"> the selected text from the toolbar, or take an inline suggestion as you type.
  links:
    - label: Try Copilot Yourself
      trailingIcon: i-ri-arrow-right-line
      to: /docs/copilot/getting-started/installation
      size: xl
sections:
  - title: Bring Context to Your<br class="hidden lg:block"> <span class="text-primary">Prompt Party</span>
    id: features
    slot: feature-cards
    cards:
      - id: skills
        name: Skills
        title: Your house rules, one mention away
        description: Define brand voice and writing rules once. Editors type @skill://, pick from the typeahead, and the prompt follows them.
        to: /docs/copilot/prompt-dialog/skills
        wide: true
      - id: blocks-and-layouts
        name: Blocks & Layouts
        title: Whole layouts from your own blocks
        description: Prompt once and Copilot fills the field with blocks or multi-column layouts built from your block blueprints, custom blocks included.
        to: /docs/copilot/advanced/blocks-and-layouts
      - id: inline-suggestions
        name: Inline Suggestions
        title: Keep typing, Copilot finishes the sentence
        description: Pause in a writer field and gray ghost text picks up the sentence. Tab keeps it, anything else drops it.
        to: /docs/copilot/usage/inline-suggestions
      - id: toolbar-buttons
        name: Toolbar Buttons
        title: Rewrite the selection where it sits
        description: Select text in a writer or textarea field, press the Copilot button, and say what should change. The result replaces the selection or follows it.
        to: /docs/copilot/usage/toolbar-buttons
        wide: true
  - title: Generate Content for<br> <span class="text-primary">Multiple Panel Fields</span>
    id: multi-field
    slot: mock
  - title: You Choose What<br> <span class="text-primary">the Agent May Do</span>
    id: agents-consent
    slot: mock
    description: Before an agent connects, the Panel names it, your site, and the account it works as – and you tick what it may do.
  - title: Your Agent Prepares,<br> <span class="text-primary">You Publish</span>
    id: agents
    slot: code
    orientation: horizontal
    description: Connect Claude, ChatGPT, Cursor, or any other agent that supports remote MCP servers. It logs in through the Panel and works as your Kirby user, within your role.
    features:
      - title: Review First
        description: Agents write into unsaved changes, and each write links to the changed content in the Panel. Publishing and deleting are permissions you tick yourself.
        icon: i-ri-eye-line
      - title: Every Connection in View
        description: The Agents view lists each connected agent with its permissions and when it was last active. Revoke one there and it loses access at once.
        icon: i-ri-plug-line
    links:
      - label: Set Up Agents
        to: /docs/copilot/agents
        trailingIcon: i-ri-arrow-right-line
        variant: subtle
    code:
      files:
        - filename: site/config/config.php
          language: php
          content: |
            return [
                'johannschopplich.copilot' => [
                    'agents' => true
                ]
            ];
        - filename: Terminal
          language: bash
          content: |
            claude mcp add --transport http kirby https://example.com/api/copilot/mcp
  - title: Drive Copilot<br> From <span class="text-primary">PHP</span>
    id: php-api
    slot: code
    orientation: horizontal
    reverse: true
    description: Call AI providers from CLI commands, hooks, or custom workflows. The same Client that powers the Panel is available to your code.
    features:
      - title: Hooks & CLI
        description: Generate content on save or in batch from the command line.
        icon: i-ri-terminal-box-line
      - title: Two Output Modes
        description: Plain text or structured objects validated against a JSON schema.
        icon: i-ri-code-line
    links:
      - label: PHP API Reference
        to: /docs/copilot/php-classes
        trailingIcon: i-ri-arrow-right-line
        variant: subtle
    code:
      minHeight: 360px
      files:
        - filename: site/commands/generate-meta-descriptions.php
          language: php
          content: |
            // Run: kirby generate-meta-descriptions

            use JohannSchopplich\Copilot\AI\Client;
            use Kirby\CLI\CLI;

            return [
                'description' => 'Generate missing meta descriptions for blog posts',
                'command' => static function (CLI $cli): void {
                    $client = Client::instance();

                    foreach (page('blog')->children() as $post) {
                        if ($post->meta_description()->isNotEmpty()) {
                            continue;
                        }

                        $description = $client->generateText([
                            ['role' => 'system', 'content' => 'Write a 155-character SEO description.'],
                            ['role' => 'user', 'content' => $post->text()->kirbytext()],
                        ]);

                        $post->update(['meta_description' => $description]);
                        $cli->out('✓ ' . $post->title());
                    }

                    $cli->success('Done');
                }
            ];
cta:
  title: Don’t Take<br class="md:hidden"> My Word for It
  description: Install the plugin and try Copilot in the Panel yourself.
  links:
    - label: Install for Free
      to: /docs/copilot/getting-started/installation
      icon: i-ri-download-line
      size: xl
      color: primary
