title: Kirby Headless – API-First CMS Plugin for Kirby
description: Turn Kirby into a headless CMS. Bearer token auth, KQL with caching, JSON templates, resolved blocks, and an Express-style API builder.
navigation.icon: i-ri-code-block
hero:
  headline:
    label: Free & Open Source
    icon: i-ri-open-source-line
  title: '<span class="text-primary">Headless CMS</span><br> Toolkit for Kirby'
  description: Everything you need to use Kirby as a headless content backend. Query content via KQL, build custom API routes, and resolve blocks – one config.php for all of it.
  links:
    - label: Get Started
      trailingIcon: i-ri-arrow-right-line
      to: /docs/headless/getting-started
      size: xl
sections:
  - title: Query Content with<br> <span class="text-primary">KQL</span>
    id: kql
    slot: code
    orientation: horizontal
    description: Send Kirby Query Language queries to one endpoint and get JSON back. With Kirby's pages cache on, responses are cached per query and language and flushed on every content change.
    features:
      - title: Bearer Token Auth
        description: Switch the endpoint to bearer mode and one token from config.php guards it
        icon: i-ri-shield-keyhole-line
      - title: Response Caching
        description: Cached per query and language once the pages cache is on; one header bypasses it
        icon: i-ri-speed-line
    links:
      - label: KQL Reference
        to: /docs/headless/usage/kql
        trailingIcon: i-ri-arrow-right-line
        variant: subtle
    code:
      minHeight: 360px
      files:
        - filename: KQL Request
          language: bash
          content: |
            curl https://example.com/api/kql \
              -H "Authorization: Bearer your-token" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "page(\"blog\").children.listed",
                "select": {
                  "title": true,
                  "text": "page.text.toBlocks.toArray",
                  "url": true
                }
              }'
        - filename: Response
          language: json
          content: |
            {
              "code": 200,
              "status": "OK",
              "result": [
                {
                  "title": "Hello World",
                  "text": [...],
                  "url": "https://example.com/blog/hello-world"
                }
              ]
            }
  - title: Everything Between<br> <span class="text-primary">Kirby and Your Frontend</span>
    id: features
    slot: features
    features:
      - title: One token guards the API
        description: Set a token in config.php and every request has to carry it as a Bearer header; missing or wrong tokens get a 401. Kirby's own API keeps its session and basic auth.
        icon: i-ri-shield-keyhole-line
        to: /docs/headless/configuration/authentication
      - title: Query anything through one endpoint
        description: POST a KQL query with a select map and get JSON back, in the language you pick by header or query parameter. Needs the getkirby/kql package.
        icon: i-ri-database-2-line
        to: /docs/headless/usage/kql
      - title: Every page answers as JSON
        description: Write templates that echo JSON. With global routes on, each page URL returns its template's output, cached per page, language and version, drafts included behind a preview token.
        icon: i-ri-braces-line
        to: /docs/headless/usage/json-templates
      - title: UUIDs become URLs, sizes and titles
        description: Call toResolvedBlocks() on a blocks or layout field and image blocks come back with url, width, height, srcset and alt. Add resolvers per block type and field for pages and other files.
        icon: i-ri-puzzle-line
        to: /docs/headless/usage/field-methods
      - title: Routes as a chain of middlewares
        description: Api::createHandler() runs your functions in order. A null continues, an array extends the context, anything else is the response. Token check, language, page resolution and body parsing ship as middlewares.
        icon: i-ri-terminal-box-line
        to: /docs/headless/advanced/api-builder
      - title: A sitemap with hreflang alternates
        description: The sitemap endpoint lists every indexable page with its URL per language and an x-default entry. Exclude pages by template, by pattern, or per blueprint.
        icon: i-ri-road-map-line
        to: /docs/headless/usage/json-templates#sitemap-endpoint
  - title: Build Custom Routes with the<br> <span class="text-primary">API Builder</span>
    id: api-builder
    slot: code
    orientation: horizontal
    reverse: true
    description: Define API routes with an Express-style middleware pattern. Chain authentication, validation, and response logic.
    features:
      - title: Middleware Support
        description: Chain the token check, language and page resolvers with functions of your own
        icon: i-ri-stack-line
      - title: Consistent Responses
        description: Api::createResponse() wraps your data in code, status and result
        icon: i-ri-code-s-slash-line
    links:
      - label: API Builder Reference
        to: /docs/headless/advanced/api-builder
        trailingIcon: i-ri-arrow-right-line
        variant: subtle
    code:
      minHeight: 360px
      files:
        - filename: site/config/config.php
          language: php
          content: |
            use JohannSchopplich\Headless\Api\Api;
            use JohannSchopplich\Headless\Api\Middlewares;

            return [
                'routes' => [
                    [
                        'pattern' => 'api/login',
                        'method' => 'POST',
                        'action' => Api::createHandler(
                            Middlewares::hasBearerToken(),
                            Middlewares::hasBody(...),
                            function (array $context, array $args) {
                                $email = $context['body']->get('email');
                                $user = kirby()->user($email);
                                return Api::createResponse(200, [
                                    'user' => $user?->email(),
                                ]);
                            }
                        ),
                    ],
                ],
            ];
cta:
  title: Free Forever. Open Source.
  description: Install the Headless plugin and start building modern frontend applications with Kirby as your content backend.
  orientation: horizontal
  links:
    - label: Read the Documentation
      trailingIcon: i-ri-arrow-right-line
      to: /docs/headless/getting-started
      size: xl
