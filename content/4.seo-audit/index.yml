title: Kirby SEO Audit – Yoast-Powered SEO Plugin for Kirby CMS
description: SEO analysis plugin for Kirby CMS powered by Yoast SEO. Content, readability, and keyphrase assessments in the Kirby Panel.
navigation.icon: i-ri-seo-line
hero:
  orientation: horizontal
  headline:
    label: Powered by Yoast SEO
    to: /docs/seo-audit/guide/assessments
    icon: i-ri-wordpress-fill
  title: '<span class="text-primary">Yoast SEO Analysis</span><br> in the Panel'
  description: Kirby SEO Audit runs the Yoast SEO engine on the page you are editing. Every result comes with its light and the fix it asks for – before the page goes live.
  links:
    - label: Run Your First Audit
      trailingIcon: i-ri-arrow-right-line
      to: /docs/seo-audit/getting-started/installation
      size: xl
  video:
    src: /screencasts/kirby-seo-audit-view-button.mp4
    poster: /screencasts/kirby-seo-audit-view-button-poster-start.jpg
sections:
  - title: Know What to Fix<br class="hidden lg:block"> <span class="text-primary">Before You Publish</span>
    slot: feature-cards
    cards:
      - id: ratings
        name: SEO & Readability Ratings
        title: One light per category, one dot on the button
        description: Every result lands in Good, OK, Needs improvement, or Feedback with the fix named. The report rates SEO and readability, and the rating goes stale once the published content changes.
        to: /docs/seo-audit/guide/ratings
        wide: true
      - id: entry-points
        name: View Button & Section
        title: One click from header or section
        description: A view button opens the report in a dialog. A section keeps it on the page, the last report included.
        to: /docs/seo-audit/configuration/local#view-button-configuration
      - id: keyphrase
        name: Keyphrase Field
        title: Rate the page against its keyphrase
        description: Editors type the keyphrase into an ordinary text field. Keyphrase checks join the report, from density and distribution to the keyphrase in title, slug, meta description, and subheadings.
        to: /docs/seo-audit/configuration/local#keyphrasefield
      - id: languages
        name: Language-Specific Features
        title: Rated in the page's own language
        description: Passive voice, transition words, and sentence length follow German, Dutch, or Spanish rules, 22 languages in all, with nothing to configure.
        to: /docs/seo-audit/guide/assessments#language-specific-features
      - id: local-analysis
        name: Local Analysis
        title: No service, no API key, no data leaving
        description: The Yoast engine ships with the plugin and analyzes the page's preview HTML right in the browser.
        to: /docs/seo-audit/getting-started#features
cta:
  title: Read the Report Before Google Does
  description: Install the plugin and run a report on a page you already have.
  orientation: horizontal
  links:
    - label: Analyze Your Page
      trailingIcon: i-ri-arrow-right-line
      to: /docs/seo-audit/getting-started/installation
      variant: subtle
      size: xl
