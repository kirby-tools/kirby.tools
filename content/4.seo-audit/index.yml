title: Kirby SEO Audit – Yoast-Powered SEO Plugin for Kirby CMS
description: SEO analysis plugin for Kirby CMS powered by Yoast SEO. 28 assessments for content optimization, readability checks, and keyword analysis in the Kirby Panel.
navigation.icon: i-ri-seo-line
hero:
  orientation: horizontal
  headline:
    label: Powered by Yoast SEO v3
    to: /docs/seo-audit/guide/assessments
    icon: i-ri-wordpress-fill
  title: '<span class="text-primary">Yoast SEO Analysis</span><br> for Kirby CMS'
  description: Kirby SEO Audit brings the power of Yoast SEO to the Kirby Panel. Improve your content and boost your rankings with 28 detailed assessments and actionable recommendations.
  links:
    - label: Generate Your SEO Report
      trailingIcon: i-ri-arrow-right-line
      to: /docs/seo-audit/getting-started/installation
      target: _blank
      size: xl
  video:
    src: /screencasts/kirby-seo-audit-view-button.mp4
    poster: /screencasts/kirby-seo-audit-view-button-poster-start.jpg
sections:
  - title: Your New Favorite <br class="hidden lg:block"> <span class="text-primary">Must-Have Plugin</span>
    slot: feature-cards
    cards:
      - id: scores
        name: SEO & Readability Scores
        title: Every check graded and grouped
        description: Results land in Good, OK, Needs improvement and Feedback, each with a count. Yoast lines link to the matching yoast.com article; the three Kirby checks state the fix in the line.
        to: /docs/seo-audit/getting-started#analysis-categories
        wide: true
      - id: entry-points
        name: View Button & Section
        title: One click from header or section
        description: A view button opens the report in a dialog. A section shows it inline and keeps the last run in the browser. Both are set in the blueprint.
        to: /docs/seo-audit/configuration/local#view-button-configuration
      - id: keyphrase
        name: Keyphrase Field
        title: Grade the page against its keyword
        description: Editors type the keyword into an ordinary text field. Nine more checks run, from density and distribution to the keyword in title, slug, meta description and subheadings.
        to: /docs/seo-audit/configuration/local#keyphrasefield
      - id: languages
        name: Language-Specific Features
        title: Graded in the page's own language
        description: The rendered page's lang attribute picks one of 22 rule sets, so passive voice, transition words and sentence length follow German, Dutch or Spanish rules instead of English ones.
        to: /docs/seo-audit/guide/assessments#language-specific-features
      - id: local-analysis
        name: Local Analysis
        title: Runs in the editor's browser
        description: The Yoast engine ships with the plugin and runs in a Web Worker. It reads the page's own preview HTML from your server; no third-party service ever sees the content.
        to: /docs/seo-audit/getting-started#key-features
cta:
  title: Watch Your Rankings Grow
  description: Give Kirby SEO Audit a try in the interactive Panel playground and see how it can help you improve the quality of your content.
  orientation: horizontal
  links:
    - label: Analyze Your Page
      trailingIcon: i-ri-arrow-right-line
      to: /docs/seo-audit/getting-started/installation
      variant: subtle
      size: xl
