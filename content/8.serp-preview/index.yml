title: Kirby SERP Preview – Google Snippet Preview for the Kirby Panel
description: Kirby CMS plugin that draws the Google result snippet for a page inside the Panel, updating as the editor types.
navigation.icon: i-ri-search-eye-line
hero:
  orientation: horizontal
  headline:
    label: Free Plugin
    icon: i-ri-open-source-line
  title: '<span class="text-primary">Google''s Snippet</span><br> While You Write It'
  description: A Panel section that draws the search result for the page being edited – favicon, site name, URL, title and description – and redraws it on every keystroke.
  links:
    - label: Install in Your Project
      trailingIcon: i-ri-arrow-right-line
      to: /docs/serp-preview
      size: xl
sections:
  - title: Write the Title <span class="text-primary">Where You Can See It</span>
    slot: features
    features:
      - title: Live, and before anything is saved
        description: The section reads the form as it stands, so typing in the title or description field redraws the snippet. It never writes, and closing the page without saving leaves nothing behind.
        icon: i-ri-refresh-line
        to: /docs/serp-preview
      - title: Reads the meta fields you already have
        description: Name a title and a description field and the snippet takes their values, falling back to a configured default, and then to the page title joined with the site title by an en dash.
        icon: i-ri-input-field
        to: /docs/serp-preview/configuration
      - title: Shortened the way your frontend shortens it
        description: A closure in your config receives the resolved value and the page before the snippet draws it – truncate at the length a result shows, strip the HTML a textarea leaves, or vary it per template.
        icon: i-ri-scissors-cut-line
        to: /docs/serp-preview/formatters
cta:
  title: See What Google Sees.
  description: Install the SERP Preview plugin and add the section to any page blueprint.
  orientation: horizontal
  links:
    - label: Get Started
      trailingIcon: i-ri-arrow-right-line
      to: /docs/serp-preview
      size: xl
