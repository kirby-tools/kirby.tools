products:
  - title: Kirby Copilot
    license: commercial
    id: copilot
    description: AI-powered content generation and text editing for Kirby CMS. Generate layouts, refine text, or let AI complete your thoughts as you type.
    reverse: true
    video:
      src: /screencasts/kirby-copilot-multi-fields-generation.mp4
      poster: /screencasts/kirby-copilot-multi-fields-generation-poster-start.jpg
      label: Demonstration of generating many fields at once in the Kirby Panel
    links:
      - label: Learn More
        to: /copilot
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/copilot/getting-started/installation
        variant: subtle
    features:
      - name: Multi-Field Generation
        description: Tick the fields, write one prompt, and Copilot fills them all in one run – with files and other pages as context.
        icon: i-ri-list-check-2
      - name: Blocks & Layouts
        description: Generate whole layouts from your own block blueprints, custom blocks included.
        icon: i-ri-dashboard-line
      - name: Inline Suggestions
        description: Pause while writing and a grey continuation appears. Tab keeps it, anything else drops it.
        icon: i-ri-input-cursor-move
  - title: Kirby Content Translator
    license: commercial
    id: content-translator
    description: One click translates entire pages, including nested blocks. Select target languages in the Panel or automate via CLI.
    video:
      src: /screencasts/kirby-content-translator-batch-translation.mp4
      poster: /screencasts/kirby-content-translator-batch-translation-poster.jpg
      label: Demonstration of Content Translator batch translations in the Kirby Panel
    links:
      - label: Learn More
        to: /content-translator
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/content-translator/getting-started/installation
        variant: subtle
    features:
      - name: One-Click Translation
        description: Translate entire pages – including nested blocks, layouts, and structure fields – with a single click in the Panel.
        icon: i-ri-cursor-line
      - name: AI-Powered Translation
        description: Use GPT, Claude, Gemini, or Mistral via Kirby Copilot for context-aware AI translations.
        icon: i-ri-sparkling-2-line
      - name: Programmatic PHP API
        description: Integrate translations in CLI commands and custom workflows. Batch translate pages or sync content from the default language.
        icon: i-ri-terminal-box-line
  - title: Kirby SEO Audit
    license: commercial
    id: seo-audit
    description: Analyze your pages, improve your content, and boost your rankings.
    reverse: true
    video:
      src: /screencasts/kirby-seo-audit-view-button.mp4
      poster: /screencasts/kirby-seo-audit-view-button-poster-start.jpg
      label: Demonstration of the SEO Audit plugin, showcasing its features and functionality
    links:
      - label: Learn More
        to: /seo-audit
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/seo-audit/getting-started/installation
        variant: subtle
    features:
      - name: 28 SEO & Readability Assessments
        description: Every check graded into Good, OK, Needs improvement and Feedback, from keyword density to meta description length.
        icon: i-ri-checkbox-circle-line
      - name: View Button & Section
        description: A view button opens the report in a dialog, a section shows it inline and keeps the last run. Both are set in the blueprint.
        icon: i-ri-layout-top-line
      - name: Runs in the Editor's Browser
        description: The Yoast engine ships with the plugin and runs in a Web Worker. No third-party service ever sees the content.
        icon: i-ri-file-lock-line
  - title: Kirby Live Preview
    license: commercial
    id: live-preview
    description: Display your page with unsaved changes in real time. It is the plugin content editors and clients have been waiting for.
    video:
      src: /screencasts/kirby-live-preview-devices.mp4
      poster: /screencasts/kirby-live-preview-devices-poster.jpg
      label: Demonstration of live preview with different device screen sizes in the Kirby Panel
    links:
      - label: Learn More
        to: /live-preview
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/live-preview
        variant: subtle
    features:
      - name: Device Screen Sizes
        description: Simulate different screen sizes to see how your content will look on mobile, tablet, and desktop.
        icon: i-ri-device-line
      - name: Detect Preview Mode
        description: Conditionally hide elements, such as a cookie banner, or turn off animations in the rendered preview page.
        icon: i-ri-drag-drop-line
      - name: Real-Time Preview
        description: See how your page looks before saving your changes and without leaving the Panel.
        icon: i-ri-notification-badge-line
  - title: Kirby Minimap
    license: free
    id: minimap
    description: A structured list of all fields and blocks of the current Panel tab. Especially useful for complex page blueprints.
    video:
      src: /screencasts/kirby-minimap-screencast.mp4
      poster: /screencasts/kirby-minimap-screencast-poster.jpg
      label: Overview demonstration of the Minimap plugin for Kirby Panel, showcasing its features and functionality
    links:
      - label: Learn More
        to: /minimap
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/minimap
        variant: subtle
    features:
      - name: Field Navigation
        description: Click on any field or block to scroll to that position in the content editor.
        icon: i-ri-cursor-line
      - name: Block Preview
        description: For block fields, the minimap shows each block with its type icon and content preview.
        icon: i-ri-layout-grid-line
      - name: Automatic Highlighting
        description: The minimap automatically highlights your current position as you scroll through the Panel view.
        icon: i-ri-focus-3-line
