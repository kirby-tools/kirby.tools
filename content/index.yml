products:
  - title: Kirby Copilot
    license: commercial
    id: copilot
    description: Generate with AI inside the Kirby Panel. Fill fields from one prompt, build layouts from your own blocks, or accept a suggestion as you type.
    reverse: true
    video:
      src: /screencasts/kirby-copilot-multi-fields-generation.mp4
      poster: /screencasts/kirby-copilot-multi-fields-generation-poster-start.jpg
      label: Demonstration of generating many fields at once in the Kirby Panel
    links:
      - label: Learn More
        to: /copilot
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/copilot/getting-started/installation
        variant: subtle
    features:
      - title: Multi-Field Generation
        description: Tick the fields, write one prompt, and Copilot fills them all in one run – with files and other pages as context.
        icon: i-ri-list-check-2
      - title: Blocks & Layouts
        description: Generate whole layouts from your own block blueprints, custom blocks included.
        icon: i-ri-dashboard-line
      - title: Inline Suggestions
        description: Pause while writing and a grey continuation appears. Tab keeps it, anything else drops it.
        icon: i-ri-input-cursor-move
  - title: Kirby Content Translator
    license: commercial
    id: content-translator
    description: One click translates entire pages, including nested blocks. Select target languages in the Panel or automate via CLI.
    video:
      src: /screencasts/kirby-content-translator-batch-translation.mp4
      poster: /screencasts/kirby-content-translator-batch-translation-poster.jpg
      label: Demonstration of Content Translator batch translations in the Kirby Panel
    links:
      - label: Learn More
        to: /content-translator
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/content-translator/getting-started/installation
        variant: subtle
    features:
      - title: Whole Pages in One Click
        description: Nested blocks, layouts and structure fields translate along with the page.
        icon: i-ri-cursor-line
      - title: DeepL or AI
        description: Translate with DeepL, or route through Kirby Copilot to ChatGPT, Claude, Gemini or Mistral.
        icon: i-ri-sparkling-2-line
      - title: The Same Pipeline from PHP
        description: Batch translate pages or sync from the default language in CLI commands and hooks.
        icon: i-ri-terminal-box-line
  - title: Kirby SEO Audit
    license: commercial
    id: seo-audit
    description: The Yoast SEO engine grades every page in the Panel. Each check comes with a verdict and the fix it asks for.
    reverse: true
    video:
      src: /screencasts/kirby-seo-audit-view-button.mp4
      poster: /screencasts/kirby-seo-audit-view-button-poster-start.jpg
      label: Demonstration of the SEO Audit plugin, showcasing its features and functionality
    links:
      - label: Learn More
        to: /seo-audit
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/seo-audit/getting-started/installation
        variant: subtle
    features:
      - title: SEO & Readability Assessments
        description: Every check graded into Good, OK, Needs improvement and Feedback, from keyword density to meta description length.
        icon: i-ri-checkbox-circle-line
      - title: View Button & Section
        description: A view button opens the report in a dialog, a section shows it inline and keeps the last run. Both are set in the blueprint.
        icon: i-ri-layout-top-line
      - title: Runs in the Editor's Browser
        description: The Yoast engine ships with the plugin and runs in a Web Worker. No third-party service ever sees the content.
        icon: i-ri-file-lock-line
  - title: Kirby Live Preview
    license: commercial
    id: live-preview
    description: A Panel section renders the page as editors type, unsaved changes included. Switch widths, click through to other pages, and stay in the editor.
    video:
      src: /screencasts/kirby-live-preview-devices.mp4
      poster: /screencasts/kirby-live-preview-devices-poster.jpg
      label: Demonstration of live preview with different device screen sizes in the Kirby Panel
    links:
      - label: Learn More
        to: /live-preview
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/live-preview
        variant: subtle
    features:
      - title: Renders as You Type
        description: The section refreshes on every change, before anything is saved.
        icon: i-ri-notification-badge-line
      - title: Three Screen Widths
        description: Toggle between phone, tablet and desktop width with one click.
        icon: i-ri-device-line
      - title: Knows It Is a Preview
        description: The page can hide the cookie banner or skip animations when rendered for the Panel.
        icon: i-ri-drag-drop-line
  - title: Kirby Minimap
    license: free
    id: minimap
    description: A sidebar lists the fields and blocks of the current Panel tab and scrolls to the one you click. Made for long blueprints.
    video:
      src: /screencasts/kirby-minimap-screencast.mp4
      poster: /screencasts/kirby-minimap-screencast-poster.jpg
      label: Overview demonstration of the Minimap plugin for Kirby Panel, showcasing its features and functionality
    links:
      - label: Learn More
        to: /minimap
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/minimap
        variant: subtle
    features:
      - title: Jump to a Field
        description: Click an entry and the Panel scrolls it into view, with a pulse on blocks.
        icon: i-ri-cursor-line
      - title: Blocks by Icon and First Words
        description: Every block appears with its fieldset icon and the start of its text.
        icon: i-ri-layout-grid-line
      - title: Marks Where You Are
        description: Fields and blocks in view are marked in the sidebar as you scroll.
        icon: i-ri-focus-3-line
  - title: Kirby Headless
    license: free
    id: headless
    description: Keep editing in Kirby and serve the content as JSON. A bearer token guards the API, KQL answers from one endpoint, and templates can return JSON instead of HTML.
    code:
      minHeight: 360px
      files:
        - filename: KQL Request
          language: bash
          content: |
            curl https://example.com/api/kql \
              -H "Authorization: Bearer your-token" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "page(\"blog\").children.listed",
                "select": {
                  "title": true,
                  "text": "page.text.toBlocks.toArray",
                  "url": true
                }
              }'
        - filename: Response
          language: json
          content: |
            {
              "code": 200,
              "status": "OK",
              "result": [
                {
                  "title": "Hello World",
                  "text": [...],
                  "url": "https://example.com/blog/hello-world"
                }
              ]
            }
    links:
      - label: Learn More
        to: /headless
        color: neutral
        variant: outline
        trailingIcon: i-lucide-arrow-right
      - label: Install now
        icon: i-ri-download-line
        to: /docs/headless/getting-started/installation
        variant: subtle
    features:
      - title: One Token Guards the API
        description: Set it in config.php and every KQL or custom route request has to carry it.
        icon: i-ri-shield-keyhole-line
      - title: Pages Answer as JSON
        description: Templates return JSON, cached per page and language, drafts behind a preview token.
        icon: i-ri-braces-line
      - title: Routes as Middleware Chains
        description: Compose custom endpoints from the token check, resolvers and functions of your own.
        icon: i-ri-git-merge-line
